<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hijay Speedy Gas Refilling | Fast LPG Gas Refills in Abuja</title>

  <meta
    name="description"
    content="Hijay Speedy Gas Refilling provides convenient LPG cooking gas refills at ₦1,700 per kg with delivery across Lugbe and Kuje, Abuja."
  >

  <meta
    name="keywords"
    content="gas refill Abuja, cooking gas Lugbe, cooking gas Kuje, LPG refill Abuja, gas delivery Lugbe, gas delivery Kuje, Hijay Speedy Gas Refilling"
  >

  <meta name="theme-color" content="#111111">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {
      --black: #111111;
      --dark: #171717;
      --dark-2: #222222;
      --red: #e63920;
      --red-dark: #c92d18;
      --orange: #ffb703;
      --yellow: #ffd166;
      --white: #ffffff;
      --cream: #fffaf2;
      --light: #f6f6f3;
      --gray: #686868;
      --border: #e7e7e7;
      --green: #18a957;

      --shadow:
        0 20px 50px rgba(0, 0, 0, 0.10);

      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--black);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .container {
      width: min(1160px, 92%);
      margin: auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-label {
      display: inline-block;
      color: var(--red);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .section-title {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .section-description {
      max-width: 650px;
      color: var(--gray);
      margin-top: 18px;
      font-size: 17px;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .top-bar {
      background: var(--black);
      color: white;
      padding: 10px 0;
      font-size: 13px;
    }

    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .top-bar span {
      opacity: .9;
    }

    .top-bar-right {
      display: flex;
      gap: 22px;
    }

    /* =========================================================
       NAVIGATION
    ========================================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--red);
      display: grid;
      place-items: center;
      color: white;
      font-size: 22px;
      box-shadow: 0 8px 20px rgba(230,57,32,.25);
    }

    .logo-text {
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      line-height: 1;
      font-size: 17px;
    }

    .logo-text small {
      display: block;
      font-family: "DM Sans", sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      margin-top: 5px;
      color: var(--red);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      font-weight: 600;
      font-size: 14px;
    }

    .nav-links a {
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--red);
    }

    .nav-cta {
      background: var(--red);
      color: white !important;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 800 !important;
    }

    .nav-cta:hover {
      background: var(--red-dark);
      transform: translateY(-2px);
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 730px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 30%, rgba(255,183,3,.18), transparent 30%),
        linear-gradient(115deg, #111 0%, #181818 55%, #252525 100%);
      color: white;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -120px;
      bottom: -180px;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(230,57,32,.10);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 60px;
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      padding: 8px 13px;
      border-radius: 50px;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #31d779;
      box-shadow: 0 0 0 5px rgba(49,215,121,.12);
    }

    .hero h1 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(45px, 6vw, 76px);
      line-height: .99;
      letter-spacing: -3px;
      max-width: 750px;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero-text {
      max-width: 640px;
      margin-top: 24px;
      color: rgba(255,255,255,.75);
      font-size: 18px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 15px 22px;
      border-radius: 11px;
      font-weight: 800;
      border: 2px solid transparent;
      transition: .25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--red);
      color: white;
    }

    .btn-primary:hover {
      background: var(--red-dark);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(230,57,32,.25);
    }

    .btn-whatsapp {
      background: var(--green);
      color: white;
    }

    .btn-whatsapp:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(24,169,87,.25);
    }

    .btn-outline {
      border-color: rgba(255,255,255,.25);
      color: white;
    }

    .btn-outline:hover {
      background: white;
      color: var(--black);
    }

    .hero-price {
      margin-top: 35px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
    }

    .hero-price strong {
      font-size: 29px;
      font-family: "Montserrat", sans-serif;
      color: var(--orange);
    }

    .hero-price span {
      color: rgba(255,255,255,.7);
      font-size: 13px;
    }

    /* Gas visual */

    .gas-visual {
      position: relative;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gas-glow {
      width: 390px;
      height: 390px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,183,3,.24), rgba(230,57,32,.04) 60%, transparent 70%);
      position: absolute;
    }

    .gas-cylinder {
      width: 225px;
      height: 360px;
      border-radius: 55px 55px 35px 35px;
      background:
        linear-gradient(90deg,
          #292929 0%,
          #555 17%,
          #181818 43%,
          #3e3e3e 67%,
          #111 100%);
      position: relative;
      z-index: 3;
      box-shadow:
        inset -20px 0 30px rgba(0,0,0,.45),
        inset 15px 0 20px rgba(255,255,255,.08),
        0 35px 60px rgba(0,0,0,.5);
    }

    .gas-cylinder::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 55px;
      top: -35px;
      left: 62px;
      border-radius: 20px 20px 8px 8px;
      background: #252525;
      box-shadow: inset 0 7px 8px rgba(255,255,255,.1);
    }

    .gas-cylinder::after {
      content: "HIJAY";
      position: absolute;
      left: 35px;
      right: 35px;
      top: 140px;
      padding: 10px 4px;
      text-align: center;
      border: 2px solid var(--orange);
      color: var(--orange);
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      transform: rotate(-4deg);
    }

    .gas-tag {
      position: absolute;
      z-index: 4;
      right: 10px;
      bottom: 65px;
      background: white;
      color: var(--black);
      padding: 17px 20px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      max-width: 190px;
    }

    .gas-tag strong {
      display: block;
      font-family: "Montserrat", sans-serif;
      font-size: 22px;
    }

    .gas-tag small {
      color: var(--gray);
    }

    /* =========================================================
       QUICK TRUST
    ========================================================= */

    .trust {
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .trust-item {
      padding: 27px 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-right: 1px solid var(--border);
    }

    .trust-item:last-child {
      border-right: none;
    }

    .trust-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff1ed;
      color: var(--red);
      font-size: 19px;
    }

    .trust-item strong {
      display: block;
      font-size: 14px;
    }

    .trust-item span {
      color: var(--gray);
      font-size: 12px;
    }

    /* =========================================================
       ORDER CARD
    ========================================================= */

    .order-section {
      background: var(--light);
    }

    .order-card {
      background: white;
      border-radius: 25px;
      box-shadow: var(--shadow);
      padding: 45px;
      display: grid;
      grid-template-columns: .7fr 1.3fr;
      gap: 50px;
      align-items: center;
    }

    .order-card h2 {
      font-family: "Montserrat", sans-serif;
      font-size: 36px;
      line-height: 1.1;
    }

    .order-card p {
      color: var(--gray);
      margin-top: 15px;
    }

    .coverage {
      display: inline-flex;
      margin-top: 22px;
      padding: 9px 13px;
      background: #eefaf3;
      color: #138547;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      outline: none;
      background: #fff;
      transition: .2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(230,57,32,.08);
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 75px;
      align-items: center;
    }

    .about-image {
      min-height: 470px;
      border-radius: 25px;
      background:
        linear-gradient(145deg, rgba(0,0,0,.15), rgba(0,0,0,.5)),
        radial-gradient(circle at 40% 30%, #ffcc50, #b83220 30%, #171717 70%);
      position: relative;
      overflow: hidden;
    }

    .about-image::after {
      content: "LPG • SAFETY • SERVICE";
      position: absolute;
      bottom: 28px;
      left: 28px;
      color: white;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 12px;
    }

    .about-cylinder {
      position: absolute;
      width: 175px;
      height: 300px;
      background: linear-gradient(90deg,#151515,#555,#111);
      border-radius: 45px 45px 25px 25px;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%) rotate(-5deg);
      box-shadow: 25px 30px 50px rgba(0,0,0,.45);
    }

    .about-cylinder::before {
      content: "";
      position: absolute;
      width: 75px;
      height: 45px;
      top: -28px;
      left: 50px;
      background: #222;
      border-radius: 14px 14px 5px 5px;
    }

    .about-cylinder::after {
      content: "HIJAY";
      position: absolute;
      top: 125px;
      left: 30px;
      right: 30px;
      border: 2px solid var(--orange);
      color: var(--orange);
      text-align: center;
      padding: 8px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .about-points {
      margin-top: 30px;
      display: grid;
      gap: 17px;
    }

    .about-point {
      display: flex;
      gap: 13px;
    }

    .check {
      width: 27px;
      height: 27px;
      min-width: 27px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff0eb;
      color: var(--red);
      font-weight: 900;
    }

    /* =========================================================
       SERVICES
    ========================================================= */

    .services {
      background: var(--light);
    }

    .services-heading {
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .services-heading .section-description {
      margin-left: auto;
      margin-right: auto;
    }

    .service-grid {
      margin-top: 55px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      border: 1px solid #e9e9e9;
      transition: .3s ease;
    }

    .service-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow);
      border-color: transparent;
    }

    .service-icon {
      width: 57px;
      height: 57px;
      display: grid;
      place-items: center;
      background: #fff1ed;
      color: var(--red);
      border-radius: 15px;
      font-size: 24px;
      margin-bottom: 22px;
    }

    .service-card h3 {
      font-family: "Montserrat", sans-serif;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .service-card p {
      color: var(--gray);
      font-size: 14px;
    }

    /* =========================================================
       PRICE
    ========================================================= */

    .price-section {
      background: var(--red);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .price-section::before {
      content: "₦";
      position: absolute;
      right: 5%;
      top: -100px;
      font-size: 500px;
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      color: rgba(255,255,255,.04);
    }

    .price-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 70px;
    }

    .price-section .section-label {
      color: var(--yellow);
    }

    .price-section .section-description {
      color: rgba(255,255,255,.8);
    }

    .price-number {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(55px, 8vw, 95px);
      font-weight: 900;
      line-height: .95;
      margin: 15px 0;
    }

    .price-card {
      background: white;
      color: var(--black);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 30px 70px rgba(0,0,0,.2);
    }

    .price-card h3 {
      font-family: "Montserrat", sans-serif;
      font-size: 26px;
    }

    .price-list {
      margin-top: 25px;
      display: grid;
      gap: 14px;
    }

    .price-list div {
      display: flex;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .price-list span {
      color: var(--gray);
    }

    /* =========================================================
       COVERAGE
    ========================================================= */

    .coverage-section {
      background: var(--cream);
    }

    .coverage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .area-card {
      background: var(--black);
      color: white;
      padding: 45px;
      border-radius: 25px;
    }

    .area-card h3 {
      font-family: "Montserrat", sans-serif;
      font-size: 30px;
    }

    .area-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .area-list span {
      padding: 10px 14px;
      border-radius: 50px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
    }

    /* =========================================================
       SAFETY
    ========================================================= */

    .safety {
      background: #111;
      color: white;
    }

    .safety-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .safety .section-description {
      color: rgba(255,255,255,.68);
    }

    .safety-list {
      margin-top: 30px;
      display: grid;
      gap: 16px;
    }

    .safety-item {
      display: flex;
      gap: 15px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
    }

    .safety-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .safety-item p {
      color: rgba(255,255,255,.62);
      font-size: 13px;
    }

    .safety-icon {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,183,3,.12);
      color: var(--orange);
    }

    /* =========================================================
       HOW IT WORKS
    ========================================================= */

    .steps {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;
      margin-top: 55px;
    }

    .step {
